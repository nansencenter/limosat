run_id: limosat-efficientloftr-run
catalogue: ./catalogue.csv
database: ./outputs/limosat.sqlite
output_directory: ./outputs
pair_product_directory: ./outputs/pair-products
analysis_epsg: 3413
pair_workers: 1
retain_pair_matches: true

matcher:
  repository: /path/to/EfficientLoFTR
  checkpoint: /path/to/eloftr_outdoor.ckpt
  model_name: efficientloftr-official-opt
  device: cuda
  pixel_size_m: 80.0
  tile_size_px: 512
  tile_margin_px: 32
  endpoint_support_radius_px: 16
  transform_grid_spacing_px: 32
  tile_grid_origin_m: 0.0
  maximum_speed_m_per_day: 43200.0  # 0.5 m/s
  tile_batch_size: 4
  prefix_cuda_graph: true
  cuda_graph_warmup_batches: 3
  # Opt-in layered layout (docs/operations.md): [[0, 0], [0.5, 0.5]] adds the
  # diagonal half-offset grid; offsets are fractions of the tile core.
  tile_grid_offsets: [[0.0, 0.0]]
  masked_rematch_target_valid_fraction: 0.0  # 0.5 re-matches partial tiles masked
  layout_dedup_m: 160.0
  layout_field_merge: primary_first  # or union
  tile_sampling: per_tile  # pair_cache resamples each scene once per block

field:
  grid_spacing_m: 4000.0
  neighbour_count: 12
  minimum_agreeing_matches: 8
  maximum_neighbour_distance_m: 6000.0
  agreement_distance_m: 1000.0
  maximum_triangle_edge_m: 6400.0
  missing_node_fallback: false  # true requires retain_pair_matches: true
  # Composition (docs/composition.md): gap filling and shear point estimates.
  gap_fill_rigid_edge_m: 12800.0
  gap_fill_rigid_spread_m: 300.0
  gap_fill_point_neighbour_count: 12
  gap_fill_point_minimum_agreeing_matches: 8
  gap_fill_point_neighbour_distance_m: 3000.0
  gap_fill_point_agreement_distance_m: 500.0
  shear_point_estimates: true

routing:
  planning_grid_spacing_m: 4000.0
  mode: sequential_local
  initial: phase_correlation
  phase_correlation_failure: same_center
  phase_correlation_minimum_response: 0.05
  coarse_matching: true
  coarse_pixel_size_m: 320.0
  coarse_minimum_matches: 12
  coarse_support_radius_m: 35840.0
  coarse_window_stride: 1  # 3 shares coarse windows (about 1.5x faster pairs)
  residual_edge_recovery: true
  candidate_minimum_elapsed_hours: 1.0
  candidate_maximum_elapsed_hours: 96.0
  candidate_minimum_overlap_fraction: 0.05
  candidate_minimum_overlap_area_m2: 1024000000.0
  exclude_same_acquisition_pass: true
  require_orbit_metadata: false
  next_observation_minimum_cells: 25
  next_observation_backup_after_hours: 30.0  # production; null: no backups
  plan_surface_cells: false  # production: true (needs a surface source)
  candidate_pair_ids: []

open_water:
  enabled: false
  sic_root: /path/to/osi-saf-sea-ice-concentration
  threshold_percent: 15.0
  maximum_age_days: 1
  samples_per_axis: 5

# Off unless land_raster or point_sic_root is set; see docs/composition.md.
surface:
  land_raster: ""
  land_minimum_inland_km: 1.0
  point_sic_root: ""
  point_sic_grid: n3125
  point_sic_fallback_root: ""
  point_sic_fallback_grid: n6250
  point_open_water_threshold_percent: 15.0

trajectories:
  add_as_coverage_enters: true
  new_point_exclusion_radius_m: 2000.0  # production: 3000.0
  merge_radius_m: null  # e.g. 250.0 merges duplicate trajectories
  merge_maximum_younger_age_hours: null  # e.g. 48.0 merges only young duplicates
